<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pattern: Staggered Card Reveal on Enter</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #101014; color: #f4f4f8; }
  .spacer { height: 50vh; display: grid; place-items: center; opacity: .5; }
  .grid { max-width: 960px; margin: 0 auto; padding: 4rem 1.5rem;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; }
  .card { background: #1c1c26; border-radius: 12px; padding: 2rem; border: 1px solid #2a2a38; }
</style>
</head>
<body>
  <div class="spacer">scroll ↓</div>

  <div class="grid" id="grid">
    <div class="card">Card 1</div>
    <div class="card">Card 2</div>
    <div class="card">Card 3</div>
    <div class="card">Card 4</div>
    <div class="card">Card 5</div>
    <div class="card">Card 6</div>
  </div>

  <div class="spacer">scroll continues ↓</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger);

    // Pattern: one ScrollTrigger per grid, staggering all children together
    // rather than one ScrollTrigger per card — cheaper and keeps the
    // stagger timing coherent regardless of how fast the grid scrolls in.
    gsap.from("#grid .card", {
      y: 40,
      opacity: 0,
      duration: 0.6,
      ease: "power2.out",
      stagger: 0.12,
      scrollTrigger: {
        trigger: "#grid",
        start: "top 80%",
        toggleActions: "play none none reverse"
      }
    });
  </script>
</body>
</html>
