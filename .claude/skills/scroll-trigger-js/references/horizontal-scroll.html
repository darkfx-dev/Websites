<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pattern: Vertical Scroll Drives Horizontal Panel Track</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #101014; color: #f4f4f8; }
  .spacer { height: 50vh; display: grid; place-items: center; opacity: .5; }
  .h-section { height: 100vh; overflow: hidden; position: relative; }
  .h-track { display: flex; height: 100%; width: max-content; }
  .panel { width: 100vw; height: 100%; display: grid; place-items: center;
    font-size: clamp(2rem, 6vw, 5rem); flex-shrink: 0; }
  .panel:nth-child(1) { background: #7c3aed; }
  .panel:nth-child(2) { background: #db2777; }
  .panel:nth-child(3) { background: #ea580c; }
  .panel:nth-child(4) { background: #16a34a; }
</style>
</head>
<body>
  <div class="spacer">scroll ↓</div>

  <section class="h-section" id="hSection">
    <div class="h-track" id="hTrack">
      <div class="panel">Panel 1</div>
      <div class="panel">Panel 2</div>
      <div class="panel">Panel 3</div>
      <div class="panel">Panel 4</div>
    </div>
  </section>

  <div class="spacer">scroll continues ↓</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger);

    // Pattern: pin the section and tween translateX across the track's
    // overflow width, so vertical scroll input reads as horizontal motion.
    const track = document.getElementById("hTrack");

    function getScrollDistance() {
      return track.scrollWidth - window.innerWidth;
    }

    let tween = gsap.to(track, {
      x: () => -getScrollDistance(),
      ease: "none",
      scrollTrigger: {
        trigger: "#hSection",
        start: "top top",
        end: () => "+=" + getScrollDistance(),
        scrub: true,
        pin: true,
        invalidateOnRefresh: true
      }
    });
  </script>
</body>
</html>
