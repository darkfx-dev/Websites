<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pattern: Scroll-Snap Between Full-Height Sections</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; color: #f4f4f8; }
  section { height: 100vh; display: grid; place-items: center; font-size: clamp(2rem, 6vw, 4rem); }
  section:nth-child(1) { background: #1e1b4b; }
  section:nth-child(2) { background: #312e81; }
  section:nth-child(3) { background: #4c1d95; }
  section:nth-child(4) { background: #701a75; }
</style>
</head>
<body>
  <section id="s1">Section 1</section>
  <section id="s2">Section 2</section>
  <section id="s3">Section 3</section>
  <section id="s4">Section 4</section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger);

    // Pattern: ScrollTrigger's built-in `snap` config animates the scroll
    // position itself to the nearest fraction once the user stops
    // scrolling — no manual wheel-event math needed. `1 / (n - 1)` gives
    // n evenly spaced snap points across the full scrollable range.
    const sections = gsap.utils.toArray("section");

    ScrollTrigger.create({
      snap: {
        snapTo: 1 / (sections.length - 1),
        duration: 0.5,
        ease: "power1.inOut"
      }
    });

    // Optional: fade each section in as it becomes the active one.
    sections.forEach((sec) => {
      gsap.fromTo(sec, { opacity: 0.4 }, {
        opacity: 1,
        scrollTrigger: {
          trigger: sec,
          start: "top center",
          end: "bottom center",
          scrub: true
        }
      });
    });
  </script>
</body>
</html>
