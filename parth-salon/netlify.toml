# Netlify config for the Parth Salon site.
# In the Netlify UI, set the site's "Base directory" to `parth-salon` so this
# file is picked up; the settings below then apply.
[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback so deep links resolve to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
